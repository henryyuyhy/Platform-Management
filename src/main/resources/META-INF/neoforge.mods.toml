# 1.21.1（NeoForge 21.1.x）必须显式声明 modLoader / loaderVersion；license 必填。
# 花括号占位符由 build.gradle 的 processResources 在构建时展开（值来自 gradle.properties）。
# 注意：不要在本文件里写“美元号+花括号”形式的示例文字，它会被 Groovy 模板当表达式求值导致构建失败。
modLoader="javafml"
loaderVersion="[1,)"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description="${mod_description}"

# Mixin 配置：服务端只需 GlobalStation / 目的地指令的织入；车站与时刻表界面是客户端专属类。
[[mixins]]
config = "createplatform.mixins.json"

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="${neo_version_range}"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"

# Create 是硬依赖：站台号字段、车站界面、时刻表指令都来自 Create，缺了它本模组没有意义。
[[dependencies.${mod_id}]]
modId="create"
type="required"
ordering="AFTER"
versionRange="${create_version_range}"
