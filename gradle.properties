org.gradle.jvmargs=-Xmx2G

# Minecraft / NeoForge（两值必须对应同一 MC 版本）
minecraft_version=1.21.1
neo_version=21.1.249

# 依赖版本区间（neoforge.mods.toml 的 dependencies 用）
minecraft_version_range=[1.21.1]
neo_version_range=[21.1,)

# Mod metadata（mod_id 与 @Mod 注解必须一致）
mod_id=createplatform
mod_name=Create Platform Numbers
mod_version=0.1.1
mod_group_id=com.henry.createplatform
mod_authors=yu
mod_license=MIT
mod_description=Adds a per-station platform number to Create train stations and a platform filter to train schedules.

# Create（编译期依赖，运行时由玩家已装的 Create 提供）
create_version=6.0.11-282
create_version_range=[6.0.11,)
# Ponder 只用于编译期补齐 Create 的类层级（StationBlockEntity -> VirtualBlockEntity），不打包。
ponder_version=1.0.82+mc1.21.1
# dev 端运行 Create 需要的其它依赖（同样不随本模组发布）
flywheel_version=1.0.6
registrate_version=MC1.21-1.3.0+67
